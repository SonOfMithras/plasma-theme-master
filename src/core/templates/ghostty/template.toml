[catalog.ghostty]
name = "Ghostty"
category = "terminal"
documentation_url = "https://docs.ptm.dev/ptm/theming/app-theming/#built-in-templates"

[templates.ghostty]
input_path = "ghostty.conf"
output_path = "$XDG_CONFIG_HOME/ghostty/themes/ptm"
post_hook = "bash '{{ config_dir }}/apply.sh'"
undo_hook = "bash '{{ config_dir }}/undo.sh'"
