[SupersonicTheme]
Name = "PTM"
Version = "0.2"
SupportsDark = true
SupportsLight = true

# PTM renders the active palette. Defining that palette for both variants
# keeps Supersonic in sync when its appearance is set to Dark, Light, or Auto.
[DarkColors]
ListHeader = "{{ colors.surface_container_high.default.hex }}"
PageBackground = "{{ colors.background.default.hex }}"
PageHeader = "{{ colors.surface_container_low.default.hex }}"
Background = "{{ colors.surface_container.default.hex }}"
Button = "{{ colors.on_surface.default.hex }}1A"
DisabledButton = "{{ colors.on_surface.default.hex }}0D"
Disabled = "{{ colors.on_surface_variant.default.hex }}80"
Error = "{{ colors.error.default.hex }}"
Focus = "{{ colors.primary.default.hex }}"
Foreground = "{{ colors.on_surface.default.hex }}"
Hover = "{{ colors.on_surface.default.hex }}14"
Hyperlink = "{{ colors.primary.default.hex }}"
InputBackground = "{{ colors.on_surface.default.hex }}0F"
InputBorder = "{{ colors.outline.default.hex }}"
MenuBackground = "{{ colors.surface_container.default.hex }}"
OverlayBackground = "{{ colors.surface_container_high.default.hex }}"
Placeholder = "{{ colors.on_surface_variant.default.hex }}"
Pressed = "{{ colors.primary.default.hex }}29"
Primary = "{{ colors.on_primary_container.default.hex }}"
ScrollBar = "{{ colors.outline.default.hex }}B3"
Selection = "{{ colors.primary.default.hex }}3D"
Separator = "{{ colors.outline_variant.default.hex }}"
Shadow = "{{ colors.shadow.default.hex }}59"
Success = "{{ colors.tertiary.default.hex }}"
Warning = "{{ colors.secondary.default.hex }}"

[LightColors]
ListHeader = "{{ colors.surface_container_high.default.hex }}"
PageBackground = "{{ colors.background.default.hex }}"
PageHeader = "{{ colors.surface_container_low.default.hex }}"
Background = "{{ colors.surface_container.default.hex }}"
Button = "{{ colors.on_surface.default.hex }}1A"
DisabledButton = "{{ colors.on_surface.default.hex }}0D"
Disabled = "{{ colors.on_surface_variant.default.hex }}80"
Error = "{{ colors.error.default.hex }}"
Focus = "{{ colors.primary.default.hex }}"
Foreground = "{{ colors.on_surface.default.hex }}"
Hover = "{{ colors.on_surface.default.hex }}14"
Hyperlink = "{{ colors.primary.default.hex }}"
InputBackground = "{{ colors.on_surface.default.hex }}0F"
InputBorder = "{{ colors.outline.default.hex }}"
MenuBackground = "{{ colors.surface_container.default.hex }}"
OverlayBackground = "{{ colors.surface_container_high.default.hex }}"
Placeholder = "{{ colors.on_surface_variant.default.hex }}"
Pressed = "{{ colors.primary.default.hex }}29"
Primary = "{{ colors.on_primary_container.default.hex }}"
ScrollBar = "{{ colors.outline.default.hex }}B3"
Selection = "{{ colors.primary.default.hex }}3D"
Separator = "{{ colors.outline_variant.default.hex }}"
Shadow = "{{ colors.shadow.default.hex }}59"
Success = "{{ colors.tertiary.default.hex }}"
Warning = "{{ colors.secondary.default.hex }}"
