[catalog.gtk4]
name = "GTK 4"
category = "system"
documentation_url = "https://docs.ptm.dev/ptm/theming/app-theming/#built-in-templates"

[templates.gtk4]
input_path = "gtk4.css"
output_path = "$XDG_CONFIG_HOME/gtk-4.0/ptm.css"
post_hook = "bash '{{ config_dir }}/apply.sh' {{ mode }}"
undo_hook = "bash '{{ config_dir }}/undo.sh'"
