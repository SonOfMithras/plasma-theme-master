###############################################################################
#                           PTM theme for superfile                       #
#                                                                             #
# Renders against the active PTM palette. Key names follow the upstream  #
# theme schema (https://superfile.dev/configure/custom-theme/).                #
###############################################################################

###############################################################################
#                           Code Syntax Highlighting                          #
###############################################################################

# Chroma style name; users can override in their superfile config.toml.
code_syntax_highlight = "catppuccin"

###############################################################################
#                                 Base Colors                                 #
###############################################################################

#-- Full Screen
full_screen_fg = "{{colors.on_surface.default.hex}}"
full_screen_bg = "{{colors.surface.default.hex}}"

#-- Gradient (two-color)
gradient_color = ["{{colors.primary.default.hex}}", "{{colors.tertiary.default.hex}}"]
directory_icon_color = "{{colors.primary.default.hex}}"

#-- File Panel
file_panel_fg = "{{colors.on_surface.default.hex}}"
file_panel_bg = "{{colors.surface.default.hex}}"
file_panel_border = "{{colors.outline.default.hex}}"
file_panel_border_active = "{{colors.primary.default.hex}}"
file_panel_top_directory_icon = "{{colors.primary.default.hex}}"
file_panel_top_path = "{{colors.primary.default.hex}}"
# Selection distinguishes the foreground only, keeping the surface uniform
# with the regular row. Mirrors the upstream catppuccin-mocha theme, where
# `file_panel_item_selected_fg` differs from `file_panel_fg` while sharing
# the same background — a subtler highlight than changing the row surface.
file_panel_item_selected_fg = "{{colors.primary.default.hex}}"
file_panel_item_selected_bg = "{{colors.surface.default.hex}}"

#-- Footer
footer_fg = "{{colors.on_surface_variant.default.hex}}"
footer_bg = "{{colors.surface.default.hex}}"
footer_border = "{{colors.outline.default.hex}}"
footer_border_active = "{{colors.primary.default.hex}}"

#-- Sidebar
# Same background as file_panel and footer (uniform panel surface). Visual
# separation is carried by the borders (`outline` inactive / `tertiary`
# active). The current-directory entry uses the primary accent for its
# foreground while keeping the surface uniform with the rest of the row,
# mirroring the file-panel selection style and the upstream catppuccin-mocha
# convention (distinguish fg only).
sidebar_fg = "{{colors.on_surface.default.hex}}"
sidebar_bg = "{{colors.surface.default.hex}}"
sidebar_title = "{{colors.primary.default.hex}}"
sidebar_border = "{{colors.outline.default.hex}}"
sidebar_border_active = "{{colors.tertiary.default.hex}}"
sidebar_item_selected_fg = "{{colors.primary.default.hex}}"
sidebar_item_selected_bg = "{{colors.surface.default.hex}}"
sidebar_divider = "{{colors.outline_variant.default.hex}}"

#-- Modals
modal_fg = "{{colors.on_surface.default.hex}}"
modal_bg = "{{colors.surface.default.hex}}"
modal_border_active = "{{colors.primary.default.hex}}"
modal_cancel_fg = "{{colors.on_error_container.default.hex}}"
modal_cancel_bg = "{{colors.error_container.default.hex}}"
modal_confirm_fg = "{{colors.on_primary.default.hex}}"
modal_confirm_bg = "{{colors.primary.default.hex}}"

#-- Help Menu
help_menu_hotkey = "{{colors.tertiary.default.hex}}"
help_menu_title = "{{colors.primary.default.hex}}"

#-- Special
cursor = "{{colors.primary.default.hex}}"
correct = "{{colors.tertiary.default.hex}}"
error = "{{colors.error.default.hex}}"
hint = "{{colors.secondary.default.hex}}"
cancel = "{{colors.error_container.default.hex}}"
