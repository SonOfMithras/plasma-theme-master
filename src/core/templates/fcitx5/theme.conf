[Metadata]
Name=ptm
Version=1.0
Author=PTM Community
Description=PTM Material You theme for Fcitx5
ScaleWithDPI=True

[InputPanel]
NormalColor={{colors.on_surface.default.hex}}
HighlightColor={{colors.on_primary.default.hex}}
HighlightBackgroundColor={{colors.primary.default.hex}}
HighlightCandidateColor={{colors.on_primary.default.hex}}
FullWidthHighlight=True
PageButtonAlignment=Last Candidate

[InputPanel/Background]
Color={{colors.surface_container_high.default.hex}}
BorderColor={{colors.primary.default.hex}}
BorderWidth=2

[InputPanel/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/Highlight]
Color={{colors.primary.default.hex}}

[InputPanel/Highlight/Margin]
Left=8
Right=8
Top=6
Bottom=6

[InputPanel/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/TextMargin]
Left=12
Right=12
Top=8
Bottom=8

[Menu]
NormalColor={{colors.on_surface.default.hex}}
HighlightColor={{colors.on_primary.default.hex}}
HighlightCandidateColor={{colors.on_primary.default.hex}}
Spacing=4

[Menu/Background]
Color={{colors.surface_container_high.default.hex}}
BorderColor={{colors.primary.default.hex}}
BorderWidth=2

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/Highlight]
Color={{colors.primary.default.hex}}

[Menu/Highlight/Margin]
Left=8
Right=8
Top=4
Bottom=4

[Menu/Separator]
Color={{colors.outline_variant.default.hex}}

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/TextMargin]
Left=8
Right=8
Top=4
Bottom=4
