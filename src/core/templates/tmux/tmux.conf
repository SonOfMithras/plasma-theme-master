# Generated by PTM

# Palette
set -gq @ptm_surface "{{ colors.surface.default.hex }}"
set -gq @ptm_on_surface "{{ colors.on_surface.default.hex }}"
set -gq @ptm_surface_container_low "{{ colors.surface_container_low.default.hex }}"
set -gq @ptm_surface_container "{{ colors.surface_container.default.hex }}"
set -gq @ptm_surface_container_high "{{ colors.surface_container_high.default.hex }}"
set -gq @ptm_surface_container_highest "{{ colors.surface_container_highest.default.hex }}"
set -gq @ptm_on_surface_variant "{{ colors.on_surface_variant.default.hex }}"
set -gq @ptm_outline "{{ colors.outline.default.hex }}"
set -gq @ptm_outline_variant "{{ colors.outline_variant.default.hex }}"
set -gq @ptm_primary "{{ colors.primary.default.hex }}"
set -gq @ptm_on_primary "{{ colors.on_primary.default.hex }}"
set -gq @ptm_primary_container "{{ colors.primary_container.default.hex }}"
set -gq @ptm_on_primary_container "{{ colors.on_primary_container.default.hex }}"
set -gq @ptm_secondary_container "{{ colors.secondary_container.default.hex }}"
set -gq @ptm_on_secondary_container "{{ colors.on_secondary_container.default.hex }}"
set -gq @ptm_tertiary_container "{{ colors.tertiary_container.default.hex }}"
set -gq @ptm_on_tertiary_container "{{ colors.on_tertiary_container.default.hex }}"
set -gq @ptm_error_container "{{ colors.error_container.default.hex }}"
set -gq @ptm_on_error_container "{{ colors.on_error_container.default.hex }}"

# Styles
set -gqF status-style "bg=#{@ptm_surface_container_low},fg=#{@ptm_on_surface}"
if-shell -F '#{==:#{@ptm_inactive_tabs_use_background},off}' \
  'set -gqF window-status-style "fg=#{@ptm_on_surface_variant}"' \
  'set -gqF window-status-style "bg=#{@ptm_surface_container},fg=#{@ptm_on_surface_variant}"'
set -gqF window-status-current-style "bg=#{@ptm_surface_container_highest},fg=#{@ptm_on_surface},bold"
set -gqF window-status-last-style "fg=#{@ptm_on_surface},bold"
set -gqF window-status-activity-style "bg=#{@ptm_tertiary_container},fg=#{@ptm_on_tertiary_container}"
set -gqF window-status-bell-style "bg=#{@ptm_error_container},fg=#{@ptm_on_error_container},bold"
set -gqF pane-border-style "fg=#{@ptm_outline_variant}"
set -gqF pane-active-border-style "##{?synchronize-panes,fg=#{@ptm_error_container},fg=#{@ptm_primary}}"
set -gqF mode-style "bg=#{@ptm_secondary_container},fg=#{@ptm_on_secondary_container},bold"
set -gqF message-style "bg=#{@ptm_primary_container},fg=#{@ptm_on_primary_container}"
set -gqF message-command-style "bg=#{@ptm_primary_container},fg=#{@ptm_on_primary_container}"
set -gqF popup-style "bg=#{@ptm_surface},fg=#{@ptm_on_surface}"
set -gqF popup-border-style "fg=#{@ptm_outline}"
set -gqF menu-style "bg=#{@ptm_surface_container_high},fg=#{@ptm_on_surface}"
set -gqF menu-selected-style "bg=#{@ptm_primary},fg=#{@ptm_on_primary},bold"
set -gqF menu-border-style "fg=#{@ptm_outline}"
set -gqF copy-mode-match-style "bg=#{@ptm_tertiary_container},fg=#{@ptm_on_tertiary_container}"
set -gqF copy-mode-current-match-style "bg=#{@ptm_primary_container},fg=#{@ptm_on_primary_container},bold"
set -gqF copy-mode-selection-style "bg=#{@ptm_secondary_container},fg=#{@ptm_on_secondary_container}"
set -gqF clock-mode-colour "#{@ptm_primary}"
