# lsd colour theme generated by PTM.
# lsd reads this file when `color.theme` is set to `custom` in config.yaml.
# Colours are [r, g, b] arrays: lsd does not accept hex strings.
user: [{{ colors.primary.default.rgb_csv }}]
group: [{{ colors.secondary.default.rgb_csv }}]
permission:
  read: [{{ colors.terminal_normal_green.default.rgb_csv }}]
  write: [{{ colors.terminal_normal_yellow.default.rgb_csv }}]
  exec: [{{ colors.terminal_normal_red.default.rgb_csv }}]
  exec-sticky: [{{ colors.terminal_normal_magenta.default.rgb_csv }}]
  no-access: [{{ colors.outline.default.rgb_csv }}]
  octal: [{{ colors.terminal_normal_cyan.default.rgb_csv }}]
  acl: [{{ colors.terminal_normal_cyan.default.rgb_csv }}]
  context: [{{ colors.terminal_bright_cyan.default.rgb_csv }}]
date:
  hour-old: [{{ colors.primary.default.rgb_csv }}]
  day-old: [{{ colors.secondary.default.rgb_csv }}]
  older: [{{ colors.on_surface_variant.default.rgb_csv }}]
size:
  none: [{{ colors.outline.default.rgb_csv }}]
  small: [{{ colors.on_surface_variant.default.rgb_csv }}]
  medium: [{{ colors.secondary.default.rgb_csv }}]
  large: [{{ colors.primary.default.rgb_csv }}]
inode:
  valid: [{{ colors.tertiary.default.rgb_csv }}]
  invalid: [{{ colors.outline.default.rgb_csv }}]
links:
  valid: [{{ colors.tertiary.default.rgb_csv }}]
  invalid: [{{ colors.outline.default.rgb_csv }}]
tree-edge: [{{ colors.outline.default.rgb_csv }}]
git-status:
  default: [{{ colors.outline.default.rgb_csv }}]
  unmodified: [{{ colors.outline.default.rgb_csv }}]
  ignored: [{{ colors.outline.default.rgb_csv }}]
  new-in-index: [{{ colors.terminal_normal_green.default.rgb_csv }}]
  new-in-workdir: [{{ colors.terminal_normal_green.default.rgb_csv }}]
  typechange: [{{ colors.terminal_normal_yellow.default.rgb_csv }}]
  deleted: [{{ colors.terminal_normal_red.default.rgb_csv }}]
  renamed: [{{ colors.terminal_normal_green.default.rgb_csv }}]
  modified: [{{ colors.terminal_normal_yellow.default.rgb_csv }}]
  conflicted: [{{ colors.terminal_bright_red.default.rgb_csv }}]
