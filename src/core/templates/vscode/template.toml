	"~/.antigravity-ide/extensions/plasma-theme-master.plasma-theme-master-1.0.0-universal/themes/PTMTheme-color-theme.json",
	"~/.antigravity-ide/extensions/plasma-theme-master.plasma-theme-master-1.0.0/themes/PTMTheme-color-theme.json",
]
requires_path = "~/.antigravity-ide"
