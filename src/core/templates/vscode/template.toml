[catalog.vscode]
name = "VSCode"
category = "editor"

[templates.vscode_code]
input_path = "vscode.json"
output_path = [
	"~/.vscode/extensions/ptm.ptmtheme-0.0.5/themes/PTMTheme-color-theme.json",
	"~/.vscode/extensions/plasma-theme-master.plasma-theme-master-1.0.0/themes/PTMTheme-color-theme.json",
]
requires_path = "~/.vscode"
post_hook = "plasma-theme-master-helper-vscode"

[templates.vscode_codium]
input_path = "vscode.json"
output_path = [
	"~/.vscode-oss/extensions/ptm.ptmtheme-0.0.5-universal/themes/PTMTheme-color-theme.json",
	"~/.vscode-oss/extensions/ptm.ptmtheme-0.0.5/themes/PTMTheme-color-theme.json",
	"~/.vscode-oss/extensions/plasma-theme-master.plasma-theme-master-1.0.0-universal/themes/PTMTheme-color-theme.json",
	"~/.vscode-oss/extensions/plasma-theme-master.plasma-theme-master-1.0.0/themes/PTMTheme-color-theme.json",
]
requires_path = "~/.vscode-oss"
post_hook = "plasma-theme-master-helper-vscode"

