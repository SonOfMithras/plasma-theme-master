[catalog.konsole]
name = "Konsole"
category = "terminal"

[templates.konsole]
input_path  = "ptm.colorscheme"
output_path = "$XDG_DATA_HOME/konsole/ptm.colorscheme"
pre_hook    = "bash '{{ config_dir }}/pre-apply.sh'"
post_hook   = "bash '{{ config_dir }}/apply.sh'"
undo_hook   = "bash '{{ config_dir }}/undo.sh'"
